name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${SDK_ROOT}" ]]; then
            echo "ANDROID_HOME is not set on this runner" >&2
            exit 1
          fi
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          if [[ -z "${SDKMANAGER}" ]]; then
            echo "sdkmanager not found under ${SDK_ROOT}/cmdline-tools" >&2
            exit 1
          fi
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "${SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_KEYSTORE_BASE64}" ]]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          echo "${RELEASE_KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "RELEASE_STORE_FILE=${RUNNER_TEMP}/release.keystore"
            echo "RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}"
            echo "RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}"
            echo "RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK integrity
        run: |
          set -euo pipefail
          BUILD_TOOLS="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools/34.0.0"
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "${APK}"
          # Reject unaligned archives: unaligned resources.arsc fails to install on API 30+.
          "${BUILD_TOOLS}/zipalign" -c 4 "${APK}"
          # The APK must carry and verify the v2/v3 signature schemes (mandatory for targetSdk 34),
          # and must contain JAR (v1) signature material for legacy package parsers.
          "${BUILD_TOOLS}/apksigner" verify --verbose "${APK}" | tee /dev/stderr | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"
          "${BUILD_TOOLS}/apksigner" verify --verbose "${APK}" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true"
          test -n "$(unzip -l "${APK}" | awk '/META-INF\/MANIFEST.MF/')"
          # The package must be parseable by aapt2 and match the expected package.
          BADGING=$("${BUILD_TOOLS}/aapt2" dump badging "${APK}")
          echo "${BADGING}" | head -3
          echo "${BADGING}" | grep -q "^package: name='com.midiedit.midi'"

      - name: Prepare release artifact
        id: artifact
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            SUFFIX="${GITHUB_REF_NAME}"
          else
            SUFFIX="dev-${GITHUB_SHA::7}"
          fi
          NAME="MIDIeditmobile-${VERSION_NAME}-${SUFFIX}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${NAME}"
          (cd dist && sha256sum "${NAME}" > "${NAME}.sha256")
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "apk=dist/${NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=dist/${NAME}.sha256" >> "$GITHUB_OUTPUT"
          echo "Prepared ${NAME}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: midi-edit-mobile-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            MIDIeditmobile の Android APK です。

            - パッケージ: `com.midiedit.midi`
            - 対応バージョン: Android 8.0 (API 26) 以上
            - 署名: リリース署名（v1 / v2 / v3）

            インストール:

            ```bash
            adb install -r ${{ steps.artifact.outputs.name }}
            ```

            - v1.2.1 以前（デバッグ署名）からアップデートする場合は、一度旧アプリをアンインストールしてからインストールしてください。
            - 「パッケージの解析中にエラーが発生しました」と表示される場合は、ダウンロードが完了しているか（ファイルサイズが約 23 MB）と Android 8.0 以上かを確認してください。
            - SHA-256 は同名の `.sha256` ファイルにあります。

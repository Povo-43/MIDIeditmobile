name: UI screenshot check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    name: Capture top bar
    # ubuntu-latest now points at a newer image where /dev/kvm is missing, so
    # the emulator fell back to software emulation and never finished booting.
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check KVM
        run: |
          ls -l /dev/kvm || echo "no /dev/kvm"
          grep -cE 'vmx|svm' /proc/cpuinfo || true

      # /dev/kvm exists on ubuntu-22.04 but the runner user has no permission,
      # so the emulator silently fell back to software emulation and took
      # 10+ minutes to boot (or never finished). Grant access via udev.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "${SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Download previous release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download v1.1.3 --pattern "*.apk" --dir release
          ls -l release

      - name: Capture screenshots on emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          emulator-boot-timeout: 1800
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -memory 3072
          script: bash .github/scripts/capture-top-bar.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top-bar-screenshots
          path: |
            before-*.png
            after-*.png
            before-*.xml
            after-*.xml
            before-*.svg
            after-*.svg
            before-displays.txt
            after-displays.txt
            wm-size.txt
            wm-density.txt
          if-no-files-found: warn
